version: 2

project_name: expirely

builds:
  - id: expirely
    main: ./cmd/expirely
    binary: expirely
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/expirely-dev/expirely-cli/internal/cli.buildVersion=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

before:
  hooks:
    - just third-party-licenses .third-party

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: .third-party
        dst: third-party

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release:
  mode: keep-existing
